# Image Shot — 依存バージョン正本（02_実装定義書.md §1「バージョン管理」に基づく）
# 2026-10-25 PR-21 更新: AGP 9.4.0（Gradle 9.6.0 最小・NDK 28.2.13676358 既定）+ built-in Kotlin。
# built-in Kotlin は AGP が Kotlin 2.2.10 を同梱し独立に変更できないため、KGP 由来の
# プラグイン（jvm / serialization / compose）も同じ 2.2.10 に統一する（migrate-to-built-in-kotlin 公式手順）。
# 出荷前に third_party.lock / SBOM と突き合わせること。
[versions]
agp = "9.4.0"
kotlin = "2.2.10"
# KSP 2.3.x は Kotlin コンパイラ版号から独立（2.3.0 以降）。AGP9 built-in Kotlin の
# R class 解決修正（google/ksp #2857・2.3.10）を含む最新安定版。
ksp = "2.3.12"
junit = "4.13.2"

coreKtx = "1.17.0"
# activity 1.11 は compose 1.9+ 前提の世代のため、compose 1.8.x 系に合わせ 1.10.1。
activityCompose = "1.10.1"
lifecycle = "2.9.4"
navigation = "2.9.5"
# androidx.benchmark 1.4.1（P2: 性能・画質計測基盤）。Gradle plugin id "androidx.benchmark" も同バージョン。
# compileSdk 36 / AGP 8.13.2 と整合する安定版。
androidxBenchmark = "1.4.1"
androidxTestExtJunit = "1.2.1"
androidxTestUiautomator = "2.3.0"

# Coil 3.3.0 が JetBrains Compose 1.8.2（→ androidx.compose 1.8.x）を strictly で要求するため、
# 本雛形は compose 1.8.x / material3 1.3.2 の BOM 系統に合わせる（compileSdk 36 で成立）。
# PR-21: built-in Kotlin（Kotlin 2.2.10・AGP 9.4 同梱で独立変更不可）から stdlib 2.2.10 が
# 暗黙配備されるが、Coil 3.3.0 の stdlib 要求（2.2.0 系・strict でない）はこれで満たされる。
# BOM 2026.x（compose 1.11/1.12）への更新は Kotlin 正本の3.x移行と Coil 更新とセットで再検証。
composeBom = "2025.06.01"

room = "2.8.5"
# BundledSQLiteDriver は ADR-021 により未採用（Room-ktx withTransaction との非互換・実機証明）。
# Room 2.8.5 が require する androidx.sqlite 2.6.2 は room-runtime が推移依存で解決する。
workManager = "2.10.5"
kotlinxSerializationJson = "1.11.0"
kotlinxCoroutines = "1.10.2"

# Coil 3.6.x は JetBrains Compose 1.12 (androidx.compose 1.12 = compileSdk 37 必須) を
# strictly で要求するため、compileSdk=36 の本雛形では 3.5.0（androidx.compose 1.11 系）に留める。
# Coil 3.4+ は JetBrains Compose 1.9+/1.11/1.12 各系統と kotlin-stdlib 2.3.10+/2.4 を
# 要求するため、built-in Kotlin 2.2.10 の本構成では 3.3.0（stdlib 2.2.0 系要求）が整合する。
# Coil更新は Kotlin 3.x 正本化（built-in Kotlin の移行先）と同時に再検証。
coil = "3.3.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

junit = { module = "junit:junit", version.ref = "junit" }

androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidxBenchmark" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidxTestUiautomator" }

# EXIF orientation 読み取り（SourceDecode 共有デコードパスで使用。androidx 実装は InputStream からの読取に対応）
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version = "1.4.1" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# PR-21: kotlin-android は AGP 9 の built-in Kotlin に統合され適用は禁止（公式移行ガイド）。
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-benchmark = { id = "androidx.benchmark", version.ref = "androidxBenchmark" }
